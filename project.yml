name: MacZipper
targets:
  MacZipper:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/MacZipper
    resources:
      - Sources/MacZipper/Resources
      - assets/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
      - package: ZipArchive
      - sdk: QuickLook.framework
      - sdk: QuickLookUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maczipper.MacZipper
        INFOPLIST_FILE: Sources/MacZipper/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MacZipper/Resources/MacZipper.entitlements
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/MacZipper/Resources/Info.plist
      properties:
        CFBundleName: MacZipper
        CFBundleDisplayName: MacZipper
        CFBundleIdentifier: com.maczipper.MacZipper
        CFBundleVersion: "0.6.0"
        CFBundleShortVersionString: "0.6.0"
        LSMinimumSystemVersion: "14.0"
        NSMainNibFile: ""
        NSPrincipalClass: NSApplication
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.maczipper.zip-archive
            UTTypeDescription: Zip Archive
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - zip
        CFBundleDocumentTypes:
          - CFBundleTypeName: Zip Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.zip-archive
              - com.maczipper.zip-archive
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  MacZipperTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/MacZipperTests
    dependencies:
      - target: MacZipper
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
  ZipArchive:
    url: https://github.com/ZipArchive/ZipArchive.git
    from: 2.6.0
